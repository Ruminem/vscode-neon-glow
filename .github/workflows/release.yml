name: Release

# Tag a commit to cut a release:
#   git tag v0.3.0 && git push origin v0.3.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      # Full history: the changelog below is built from the commits between this
      # tag and the one before it, and the default shallow clone has neither the
      # commits nor the tags to find them with.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Node 24 rather than the runner default: it is the LTS with the longest
      # remaining life, and this repository is touched rarely enough that the
      # next bump should be far away. Nothing here has dependencies to install,
      # so this only decides what runs npx.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # A tag that disagrees with package.json still packages, but the VSIX
      # would install under the old version number. Fail loudly instead.
      - name: Check the tag against package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag is $tag but package.json says $pkg" >&2
            exit 1
          fi

      - name: Package
        run: npx --yes @vscode/vsce@latest package --out "neon-glow-${GITHUB_REF_NAME#v}.vsix"

      # Both are checked out on Linux, so .gitattributes is the only thing keeping
      # their line endings apart: a .cmd with bare LF misparses goto, and a .sh
      # with CRLF fails on its own shebang.
      - name: Build the double-click bundles
        run: |
          ver="${GITHUB_REF_NAME#v}"
          if ! grep -q $'\r' install.cmd; then
            echo "install.cmd lost its CRLF line endings" >&2
            exit 1
          fi
          if grep -q $'\r' install.sh; then
            echo "install.sh picked up CRLF line endings" >&2
            exit 1
          fi

          mkdir -p "win/neon-glow-$ver" "nix/neon-glow-$ver"
          cp "neon-glow-$ver.vsix" install.cmd "win/neon-glow-$ver/"
          cp "neon-glow-$ver.vsix" install.sh  "nix/neon-glow-$ver/"
          chmod +x "nix/neon-glow-$ver/install.sh"

          (cd win && zip -r "../neon-glow-$ver-windows.zip" "neon-glow-$ver")
          (cd nix && tar czf "../neon-glow-$ver-macos-linux.tar.gz" "neon-glow-$ver")

      # The changelog, from commits rather than from pull requests.
      #
      # --generate-notes builds its list out of merged PRs, and everything here
      # goes straight to main, so it produced a compare link and nothing else -
      # ten releases in a row that said what the extension is and never what
      # changed in them. Subjects are written as sentences about what and why,
      # which is exactly what a changelog line wants to be.
      #
      # The version bump is dropped: it is the commit that made the tag, not a
      # change anyone downloads it for.
      - name: Build the changelog
        run: |
          prev="$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || true)"
          if [ -n "$prev" ]; then
            echo "## Changes since $prev" > changes.md
          else
            echo "## Changes" > changes.md
            prev="$(git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          echo "" >> changes.md
          git log --no-merges --format='- %s' "$prev..$GITHUB_REF_NAME"             | grep -v '^- Bump to ' >> changes.md || true
          echo "" >> changes.md
          cat changes.md

      # Written with a quoted heredoc so the backticks stay literal, then the
      # version and the changelog are substituted in.
      - name: Write the release notes
        run: |
          cat > notes.md <<'EOF'
          Neon glow for VS Code syntax highlighting, for any colour theme.

          Docs: [English](https://github.com/REPOSLUG/blob/TAGNAME/README.md) · [한국어](https://github.com/REPOSLUG/blob/TAGNAME/README.ko.md)

          CHANGELOG

          ## Install

          ### Windows, double-click

          Download `neon-glow-VERSION-windows.zip` below, unzip it, and run
          `install.cmd`. It finds VS Code, installs the extension and patches the
          workbench in one pass. Nothing else has to be on the machine.

          ### macOS and Linux, one script

          Download `neon-glow-VERSION-macos-linux.tar.gz`, unpack it, and run
          `./install.sh`. Same idea: it finds VS Code, installs the extension and
          patches the workbench. If the install directory belongs to root it will
          say so and tell you to re-run it with `sudo`.

          A VS Code installed as a **snap or a flatpak cannot be patched at all** —
          those are mounted read-only. Use the `.deb`, the `.rpm` or the tarball.

          ### Anywhere else

          Download `neon-glow-VERSION.vsix` below, then either use `...` →
          **Install from VSIX** in the Extensions view, or:

          ```sh
          code --install-extension neon-glow-VERSION.vsix
          ```

          Installing the extension does not by itself make anything glow: the payload
          has to be written into `workbench.js`. The extension offers to do that the
          first time it activates, or run **Neon Glow: Show status** from
          the command palette. It needs write access to the VS Code install directory.

          ### Then restart

          **Quit VS Code completely and start it again** — "Reload Window" is not
          enough. Chromium serves the bundle from cache, so a window never picks up a
          rewrite it did not start with. The `NEON:ON` status bar item stays amber
          while that is still pending.

          <details>
          <summary><b>한국어 설치 안내</b></summary>

          ### Windows, 더블클릭

          아래 `neon-glow-VERSION-windows.zip`을 받아 풀고 `install.cmd`를 실행한다.
          VS Code를 찾고, 확장을 설치하고, 워크벤치를 패치하는 것까지 한 번에 한다.
          따로 깔아둘 것은 없다.

          ### macOS · Linux, 스크립트 하나

          `neon-glow-VERSION-macos-linux.tar.gz`를 받아 풀고 `./install.sh`를 실행한다.
          하는 일은 같다. VS Code를 찾고, 확장을 설치하고, 워크벤치를 패치한다. 설치
          디렉터리가 root 소유면 그렇다고 알려주고 `sudo`로 다시 실행하라고 안내한다.

          **snap이나 flatpak으로 설치한 VS Code는 패치 자체가 불가능하다.** 읽기 전용으로
          마운트되기 때문이다. `.deb`, `.rpm`, 또는 타르볼을 쓰면 된다.

          ### 그 외 환경

          아래 `neon-glow-VERSION.vsix`를 받아, 확장 뷰에서 `...` → **VSIX에서 설치**를
          누르거나 명령줄로:

          ```sh
          code --install-extension neon-glow-VERSION.vsix
          ```

          확장을 설치하는 것만으로는 아무것도 빛나지 않는다. 페이로드가 `workbench.js`에
          들어가야 한다. 확장이 처음 활성화될 때 물어보고, 명령 팔레트에서
          **Neon Glow: Show status**를 직접 실행해도 된다. VS Code 설치
          디렉터리에 쓰기 권한이 필요하다.

          ### 그다음 재시작

          **VS Code를 완전히 종료했다가 다시 켠다.** "창 다시 로드"로는 부족하다.
          Chromium이 번들을 캐시에서 내주기 때문에, 창은 자기가 뜰 때 읽은 번들을 끝까지
          돌린다. 그게 밀려 있는 동안에는 `NEON:ON` 상태 표시줄 항목이 앰버색으로 남는다.

          </details>
          EOF
          sed -i "s/VERSION/${GITHUB_REF_NAME#v}/g" notes.md
          sed -i "s|REPOSLUG|$GITHUB_REPOSITORY|g; s|TAGNAME|$GITHUB_REF_NAME|g" notes.md
          sed -i "/^CHANGELOG$/r changes.md" notes.md
          sed -i "/^CHANGELOG$/d" notes.md

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            "neon-glow-$ver.vsix" \
            "neon-glow-$ver-windows.zip" \
            "neon-glow-$ver-macos-linux.tar.gz"
