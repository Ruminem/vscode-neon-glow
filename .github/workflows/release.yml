name: Release

# Tag a commit to cut a release:
#   git tag v0.3.0 && git push origin v0.3.0
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  vsix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # A tag that disagrees with package.json still packages, but the VSIX
      # would install under the old version number. Fail loudly instead.
      - name: Check the tag against package.json
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "tag is $tag but package.json says $pkg" >&2
            exit 1
          fi

      - name: Package
        run: npx --yes @vscode/vsce@latest package --out "neon-glow-${GITHUB_REF_NAME#v}.vsix"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            ./*.vsix
